<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1215">
<title>CONNECT is offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1215; color: #e8f0ec;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 360px; padding: 24px; text-align: center; }
  h1 { font-size: 24px; line-height: 1.2; margin: 24px 0 8px; }
  p { color: #a9b8b1; margin: 0 0 24px; }
  button { min-height: 48px; width: 100%; border: 0; border-radius: 12px; background: #72d58a; color: #06281f;
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 2px solid #e8f0ec; outline-offset: 3px; }
</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="72" height="72" role="img" aria-label="CONNECT">
  <rect width="64" height="64" rx="16" fill="#063b2d"/>
  <path d="M43.5 17.5a21 21 0 1 0 0 29" fill="none" stroke="#d9f7df" stroke-width="7" stroke-linecap="round"/>
  <path d="M39 18.5 25 32l14 13.5" fill="none" stroke="#72d58a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="39" cy="18.5" r="4.2" fill="#a8f0b6" stroke="#063b2d" stroke-width="1.8"/>
  <circle cx="39" cy="45.5" r="4.2" fill="#a8f0b6" stroke="#063b2d" stroke-width="1.8"/>
</svg>
  <h1>You are offline</h1>
  <p>CONNECT needs the internet to show seats, bookings and your bus. Turn on mobile data or Wi-Fi, then try again. Nothing you booked is lost.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
