upstream connect_app { server 127.0.0.1:8001; server 127.0.0.1:8002; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name connect.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name connect.example.com;
    ssl_certificate     /etc/letsencrypt/live/connect.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect.example.com/privkey.pem;
    client_max_body_size 5m;
    root /srv/connect/frontend-react/dist;

    # Overwrite, never append: a client-supplied X-Forwarded-For must be useless.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location /api/   { proxy_pass http://connect_app; }
    location /admin/ { proxy_pass http://connect_app; }
    location /ws/ {
        proxy_pass http://connect_app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /static/ { alias /srv/connect/backend/staticfiles/; expires 7d; }
    location / { try_files $uri /index.html; }
}
