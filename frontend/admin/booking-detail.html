<!-- Booking detail page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect — Booking Detail</title>
    <link rel="stylesheet" href="../static/css/main.css">
    <link rel="stylesheet" href="../static/css/admin.css">
</head>
<body>
    <div class="admin-header">
        <h1 id="booking-number">Booking</h1>
        <span id="status"></span>
    </div>

    <div class="container" style="margin-top:20px">
        <div class="section-title">Passenger Info</div>
        <div class="detail-row">
            <span class="detail-label">Name</span>
            <span class="detail-value" id="passenger-name"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Phone</span>
            <span class="detail-value" id="passenger-phone"></span>
        </div>

        <div class="section-title" style="margin-top:20px">Booking Info</div>
        <div class="detail-row">
            <span class="detail-label">Company</span>
            <span class="detail-value" id="company"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Route</span>
            <span class="detail-value" id="route"></span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Pickup</span>
            <span class="detail-value" id="pickup"></span>
        </div>

        <div id="assign-section" style="display:none;margin-top:24px">
            <div class="section-title">Assign Driver</div>
            <select class="driver-select" id="driver-select">
                <option value="">Loading drivers...</option>
            </select>
            <div class="error-msg" id="assign-error"></div>
            <button class="btn btn-primary" style="background:#1a2f4b" onclick="handleAssignDriver(event)">
                Assign Driver & Notify Passenger
            </button>
        </div>

        <div id="driver-section" style="display:none;margin-top:24px">
            <div class="section-title">Driver Assigned</div>
            <div class="detail-row">
                <span class="detail-label">Driver Name</span>
                <span class="detail-value" id="driver-name"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Driver Phone</span>
                <span class="detail-value" id="driver-phone"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Bus Number</span>
                <span class="detail-value" id="driver-bus"></span>
            </div>
            <div class="section-title" style="margin-top:20px">Stage departure</div>
            <div class="detail-row">
                <label class="detail-label" for="departure-minutes">Minutes until bus leaves</label>
                <input id="departure-minutes" type="number" min="0" max="240" placeholder="e.g. 15">
            </div>
            <div class="error-msg" id="departure-error"></div>
            <div class="success-msg" id="departure-message"></div>
            <button class="btn btn-primary" type="button" onclick="handleSetStageDeparture()">Update passenger ETA</button>
        </div>

        <button class="btn btn-outline" onclick="location.href='dashboard.html'" style="margin-top:24px">
            Back to Dashboard
        </button>
    </div>

    <script src="../static/js/api.js"></script>
    <script src="../static/js/admin.js"></script>
    <script>
        loadBookingDetail()
        loadDrivers()
    </script>
</body>
</html>
