<!-- Booking dashboard page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect — Admin Dashboard</title>
    <link rel="stylesheet" href="../static/css/main.css">
    <link rel="stylesheet" href="../static/css/admin.css">
</head>
<body>
    <div class="admin-header">
        <h1>Dashboard</h1>
        <span>Connect Admin</span>
    </div>

    <div class="container" style="margin-top:20px">
        <div class="stats-row">
            <div class="stat-card">
                <div class="number" id="total">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card">
                <div class="number" id="pending" style="color:#b7770d">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="number" id="confirmed" style="color:#1a6b2f">0</div>
                <div class="stat-label">Confirmed</div>
            </div>
        </div>

        <div class="section-title">All Bookings</div>
        <div id="booking-list">
            <p style="color:#888;text-align:center;padding:32px">Loading bookings...</p>
        </div>

        <button class="btn btn-outline" onclick="loadDashboard()" style="margin-top:12px">
            Refresh
        </button>

        <div class="section-title" style="margin-top:28px">Add driver</div>
        <form id="driver-form" onsubmit="handleCreateDriver(event)">
            <input name="name" placeholder="Driver name" required>
            <input name="phone_number" placeholder="Driver phone number" required>
            <input name="bus_number" placeholder="Bus number" required>
            <input type="hidden" name="company" id="driver-company">
            <button class="btn btn-primary" type="submit">Add driver</button>
            <div class="success-msg" id="driver-message"></div>
        </form>
        <a href="../driver/driver.html">Open driver location app</a>
    </div>

    <script src="../static/js/api.js"></script>
    <script src="../static/js/admin.js"></script>
    <script>
        document.getElementById('driver-company').value = load('admin_company')
        loadDashboard()
    </script>
</body>
</html>
