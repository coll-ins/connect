<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect — Create Admin Account</title>
    <link rel="stylesheet" href="../static/css/main.css">
    <link rel="stylesheet" href="../static/css/admin.css">
</head>
<body>
    <div class="admin-header">
        <h1>Create operator account</h1>
        <span>SACCO Operator Panel</span>
    </div>
    <main class="container" style="margin-top:32px">
        <form id="admin-signup-form">
            <div class="label">Company</div>
            <select name="company" id="company" required><option value="">Choose your company</option></select>
            <div class="label">Full name</div>
            <input name="username" placeholder="e.g. Collins Mwangi" required>
            <div class="label">Phone number</div>
            <input name="phone_number" type="tel" placeholder="e.g. 0712345678" required>
            <div class="label">Location</div>
            <input name="location" placeholder="e.g. Nairobi" required>
            <div class="label">Password</div>
            <input name="password" type="password" minlength="8" required>
            <div class="label">Admin access code</div>
            <input name="admin_code" type="password" placeholder="Enter admin code" required>
            <div class="error-msg" id="error"></div>
            <button class="btn btn-primary" type="submit">Create admin account</button>
        </form>
        <p style="text-align:center;font-size:14px;color:#666">
            Already registered? <a href="login.html" style="color:#1a6b2f;font-weight:600">Back to login</a>
        </p>
    </main>
    <script src="../static/js/api.js"></script>
    <script src="../static/js/admin.js"></script>
    <script>
        getCompanies().then(res => {
            if (res.ok) res.data.forEach(company => document.getElementById('company').insertAdjacentHTML('beforeend', `<option value="${company.id}">${company.name}</option>`))
        })
        document.getElementById('admin-signup-form').addEventListener('submit', handleAdminSignup)
    </script>
</body>
</html>
