<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Loading</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; overflow: hidden; background: #020704; color: white; font-family: "Segoe UI", sans-serif; }
        .splash { position: relative; display: grid; place-items: center; min-height: 100vh; background: radial-gradient(ellipse at 35% 50%, #071a0c 0%, #020704 100%); }
        svg { width: min(800px, 95vw); height: auto; }
        .grid { opacity: 0; animation: fade .6s ease .1s forwards; }
        .outer { stroke-dasharray: 742; stroke-dashoffset: 742; animation: draw 1.2s cubic-bezier(.4,0,.2,1) .3s forwards; }
        .inner { opacity: 0; animation: fade .5s ease 1.2s forwards; }
        .route { stroke-dasharray: 140; stroke-dashoffset: 140; animation: draw .55s cubic-bezier(.4,0,.2,1) 1.4s forwards; }
        .route.two { animation-delay: 1.9s; }
        .route.three { animation-delay: 2.35s; }
        .node { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop .4s cubic-bezier(.34,1.56,.64,1) 2s forwards; }
        .node.right { animation-delay: 2.4s; }
        .node.top { animation-delay: 2.85s; }
        .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.2s ease-in-out 3.2s infinite; }
        .bus-dot { offset-path: path("M248,272 L188,158"); offset-distance: 0%; animation: travel .9s ease-in-out 2.4s forwards; }
        .divider { stroke-dasharray: 164; stroke-dashoffset: 164; animation: draw .5s ease 3.3s forwards; }
        .wordmark { opacity: 0; transform: translateY(18px); animation: up .7s cubic-bezier(.22,1,.36,1) 3.5s forwards; }
        .underline { transform-origin: left; transform: scaleX(0); animation: scale .5s cubic-bezier(.22,1,.36,1) 4s forwards; }
        .tagline, .pill, .corner { opacity: 0; animation: fade .6s ease 4.2s forwards; }
        .pill { transform: translateY(12px); animation: up .4s ease 4.5s forwards; }
        .pill.two { animation-delay: 4.65s; }
        .pill.three { animation-delay: 4.8s; }
        .corner { animation-delay: 4.9s; }
        .skip { position: absolute; right: 24px; bottom: 22px; padding: 10px 14px; border: 1px solid rgba(134,239,172,.35); border-radius: 999px; color: #bbf7d0; background: rgba(13,41,20,.72); cursor: pointer; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        @keyframes fade { to { opacity: 1; } }
        @keyframes up { to { opacity: 1; transform: translateY(0); } }
        @keyframes scale { to { transform: scaleX(1); } }
        @keyframes pop { 60% { opacity: 1; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pulse { 0%,100% { opacity: 0; transform: scale(.8); } 50% { opacity: .4; transform: scale(1.5); } }
        @keyframes travel { 0% { opacity: .3; offset-distance: 0%; } 10%,90% { opacity: 1; } 100% { opacity: 0; offset-distance: 100%; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; } }
    </style>
</head>
<body>
    <main class="splash" aria-label="Connect loading">
        <svg viewBox="0 0 800 460" role="img" aria-label="Connect transport network animation" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="glow"><stop stop-color="#16a34a" stop-opacity=".22"/><stop offset="1" stop-color="#16a34a" stop-opacity="0"/></radialGradient>
                <linearGradient id="word" x1="0" x2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#86efac"/></linearGradient>
                <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22c55e"/><stop offset=".5" stop-color="#16a34a" stop-opacity=".3"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
                <filter id="soft"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <g class="grid" stroke="#22c55e" stroke-width=".5" stroke-opacity=".05"><path d="M0 92h800M0 184h800M0 276h800M0 368h800M160 0v460M320 0v460M480 0v460M640 0v460"/></g>
            <circle cx="188" cy="230" r="150" fill="url(#glow)"/>
            <circle class="outer" cx="188" cy="230" r="118" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-dasharray="4 8"/>
            <circle class="inner" cx="188" cy="230" r="102" fill="#0b2211" stroke="#1f5c2e" stroke-width="1.5"/><circle class="inner" cx="188" cy="230" r="88" fill="#0d2914"/>
            <line class="route" x1="188" y1="158" x2="128" y2="272" stroke="#22c55e" stroke-width="2" opacity=".65" filter="url(#soft)"/><line class="route two" x1="128" y1="272" x2="248" y2="272" stroke="#22c55e" stroke-width="2" opacity=".65" filter="url(#soft)"/><line class="route three" x1="248" y1="272" x2="188" y2="158" stroke="#22c55e" stroke-width="2" opacity=".65" filter="url(#soft)"/>
            <circle class="bus-dot" r="5" fill="#22c55e" filter="url(#soft)"/>
            <g class="node" transform="translate(128 272)"><circle r="12" fill="#0b2211" stroke="#22c55e" stroke-width="1.5"/><circle r="6" fill="#22c55e"/></g>
            <g class="node right" transform="translate(248 272)"><circle r="12" fill="#0b2211" stroke="#22c55e" stroke-width="1.5"/><circle r="6" fill="#22c55e"/></g>
            <g class="node top" transform="translate(188 158)"><circle class="pulse" r="22" fill="none" stroke="#fbbf24" stroke-width="2"/><circle r="14" fill="#0b2211" stroke="#fbbf24" stroke-width="2"/><circle r="7" fill="#fbbf24"/></g>
            <line class="divider" x1="318" y1="148" x2="318" y2="312" stroke="#22c55e" stroke-width=".75" stroke-opacity=".3"/>
            <text class="wordmark" x="356" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="82" font-weight="900" fill="url(#word)" letter-spacing="-2">CONNECT</text><rect class="underline" x="356" y="224" width="394" height="2.5" rx="1.25" fill="#16a34a" opacity=".7"/>
            <text class="tagline" x="358" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" fill="#4ade80" letter-spacing="4">YOUR MATATU. YOUR TIME.</text>
            <g class="pill"><rect x="356" y="282" width="110" height="30" rx="15" fill="#0d2914" stroke="#16a34a"/><text x="373" y="302" font-family="Segoe UI,Arial" font-size="11" fill="#4ade80">SACCO</text></g><g class="pill two"><rect x="480" y="282" width="130" height="30" rx="15" fill="#0d2914" stroke="#16a34a"/><text x="495" y="302" font-family="Segoe UI,Arial" font-size="11" fill="#4ade80">NAIROBI, KE</text></g><g class="pill three"><rect x="624" y="282" width="110" height="30" rx="15" fill="#16a34a" opacity=".2" stroke="#22c55e"/><text x="640" y="302" font-family="Segoe UI,Arial" font-size="11" fill="#4ade80">v1.0 BETA</text></g>
            <g class="corner" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity=".3"><path d="M30 50V30h20M750 50V30h-20M30 410v20h20M750 410v20h-20"/></g>
        </svg>
        <button class="skip" type="button" onclick="finishSplash()">Skip intro</button>
    </main>
    <script>
        function finishSplash() { sessionStorage.setItem('connectSplashSeen', '1'); window.location.replace('index.html'); }
        window.setTimeout(finishSplash, 5600);
    </script>
</body>
</html>
