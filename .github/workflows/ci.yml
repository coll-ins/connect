name: CONNECT CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: connect_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d connect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-secret-key-long-enough-for-deploy-check-0123456789
      DEBUG: "True"
      ADMIN_SIGNUP_CODE: ci-only-admin-signup-code-not-real-long
      PAYSTACK_SECRET_KEY: sk_test_ci_only_not_real
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/connect_test
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      FRONTEND_URL: https://app.example.invalid
      CORS_ALLOWED_ORIGINS: https://app.example.invalid
      ADMIN_ALERT_PHONE_NUMBERS: "+254700000000"
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1
      AT_USERNAME: ci-test
      AT_API_KEY: ci-only-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes
      - name: Django system check
        run: python manage.py check
      - name: Deployment kit integrity check
        run: bash ../deploy/check_kit.sh
      - name: Production deployment check
        run: bash ../deploy/prod_check.sh
      - name: Static analysis for auth
        run: pyflakes users/
      - name: Backend test suite
        run: python manage.py test --verbosity 1

  frontend:
    name: Frontend checks and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome
      - name: Browser tests
        run: npm run test:e2e
